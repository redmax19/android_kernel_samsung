name: Build Samsung Kernel (Galaxy s20fe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v7

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            bc \
            cpio \
            zip \
            unzip \
            zstd \
            patchelf \
            curl \
            git

      - name: Setup Neutron Clang
        run: |
          mkdir -p neutron-clang
          cd neutron-clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          cd ..

      - name: ksu
        run: |
         wget https://raw.githubusercontent.com/rksuorg/kernel_patches/refs/heads/master/manual_hook/kernel-4.19_5.4.patch
         patch -p1 < kernel-4.19_5.4.patch
         curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
         curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M RTdrivers

      - name: Configure and Build Kernel
        run: bash build_kernel.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
         name: Image.gz-and-modules-r8s
         path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/drivers/memkernel/RTdrivers_memk.ko
